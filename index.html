<style>
  :root {

    --text: #e2e8f0;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;

    align-items: center;
    padding: 20px;

  .container {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

  /* Прогресс */
  .progress-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 24px; }

  /* Вопрос */
  .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; line-height: 1.5; }

  /* Ответы */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 14px 18px; background: #334155; border: 2px solid transparent; border-radius: 12px;
    color: var(--text); font-size: 1rem; text-align: left; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .option:hover:not(:disabled) { background: #475569; border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { background: var(--correct); color: #052e16; font-weight: 600; }
  .option.wrong { background: var(--wrong); color: #450a0a; font-weight: 600; }

  /* Экран результатов */
  .result { text-align: center; padding: 20px 0; }
  .result .score-big { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 16px 0; }
  .result .message { font-size: 1.1rem; margin-bottom: 24px; color: var(--muted); }
  .btn { padding: 14px 32px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  .btn:hover { background: #2563eb; }
  .hidden { display: none; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  .timer.danger { color: var(--wrong); }
</style>

  { q: "FLP (Fischer-Lynch-Paterson) nátiyjesi neni dálilleydi?", o: ["Asinxron tarmaqta bir túyin islemey qalıwı mümkin bolsa, kelisiw kepillik bermeytuǵınlıǵın", "Hár qanday konsensus algoritmi bir sekund ishinde juwmaqlanıwı kerekligin", "Sinxron tarmaqta hesh qanday algoritm kelisimge ulıwma erise almaytuǵınlıǵın", "Vizantiya qátelerinde kelisiw ushın keminde 2f+1 túyin jeterli ekenligin"], a: 0 },
  { q: "Ethereum PoS da blok finallastırılıwı (finalized) ushın ne talap etiledi?", o: ["Checkpoint izbe-iz eki epoxada ulıwma staketiń keminde 2/3 bólimi dawısın alıwı", "Maynerler tárepinen keminde 6 tastıyıqlaw (confirmation) beriliwi", "Barlıq validatorlardıń bir dawıstan qollap-quwatlawı", "Checkpoint bir blokta ulıwma staketiń yarımınan bir dawıs kóp bólimin alıwı"], a: 0 },
  { q: "PoW sistemasında jańa bloklardı jaratıw menen shuǵıllanıwshı qatnasıwshı qalay ataladı?", o: ["Delegat", "Mayner", "Validator", "Orakul"], a: 1 },
  { q: "PoS sistemasında blok jaratıwshı validator tańlawǵa tiykarınan ne tásir etedi?", o: ["Kompyuterdiń esaplaw tezligi hám quwatı", "Hámyan jaratılǵannan berli ótken waqıt", "Túyinniń tarmaqtaǵı IP adresi", "girewge qoyılǵan tokenler (stake) muǵdarı"], a: 3 },
  { q: "Raft algoritmi 5 túyinnen ibarat klasterde neshe túyin buzılıwına shıdamlı boladı hám Vizantiya qátelerine shıdamlı ma?", o: ["2 túyinge shıdamlı, Vizantiya qátelerine shıdamlı emes", "2 túyinge shıdamlı hám Vizantiya qátelerine de shıdamlı", "1 túyinge shıdamlı hám Vizantiya qátelerine shıdamlı", "4 túyinge shıdamlı, biraq Vizantiya qátelerine shıdamlı emes"], a: 0 },
  { q: "PoA algoritminde bloklardı kimler tastıyıqlaydı?", o: ["Eń kóp token girewge qoyǵan qálegen paydalanıwshı", "Eń kóp elektr energiyasın sarplaǵan hám eń kúshli maynerler toparı", "Tosınnan tańlanǵan ápiwayı paydalanıwshılar", "Aldınnan tańlanǵan hám abıroyı menen juwap beretuǵın validatorlar"], a: 3 },
  { q: "PoS sistemalarda \"nothing at stake\" mashqalasının mánisi nede?", o: ["Maynerler esaplaw resursın biykarǵa sarplap, tarmaqtı ástelestiriwi", "Tarmaqta jeterli muǵdardaǵı tokenler joqlıǵı hám bahanıń túsiwi", "Validatorlar token girewin ulıwma qoya almawı hám sol sebepli qatnasa almawı", "Validator bir waqıtta birneshe forkti qollap-quwatlaw arzan túsiwi"], a: 3 }
];

/* ============================================================
   ЛОГИКА ВИКТОРИНЫ
   ============================================================ */
const TIME_PER_QUESTION = 20;

let questions = [];
let current = 0;
let score = 0;
let timerId = null;
let timeLeft = TIME_PER_QUESTION;
let locked = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(QUESTIONS).map(q => {
    const correctText = q.o[q.a];
    const opts = shuffle(q.o);
    return { q: q.q, o: opts, a: opts.indexOf(correctText) };
  });
  current = 0;
  score = 0;
  document.getElementById("qTotal").textContent = questions.length;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[current];
  document.getElementById("qNum").textContent = current + 1;
  document.getElementById("scoreNow").textContent = score;
  document.getElementById("progressFill").style.width = ((current) / questions.length * 100) + "%";
  document.getElementById("questionText").textContent = q.q;

  const box = document.getElementById("optionsBox");
  box.innerHTML = "";
  q.o.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(idx, btn);
    box.appendChild(btn);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  timeLeft = TIME_PER_QUESTION;
  const timerEl = document.getElementById("timer");
  timerEl.classList.remove("danger");
  timerEl.textContent = `⏱ ${timeLeft}s`;
  timerId = setInterval(() => {
    timeLeft--;
    timerEl.textContent = `⏱ ${timeLeft}s`;
    if (timeLeft <= 5) timerEl.classList.add("danger");
    if (timeLeft <= 0) { clearInterval(timerId); timeUp(); }
  }, 1000);
}

function timeUp() {
  if (locked) return;
  locked = true;
  const q = questions[current];
  const btns = document.querySelectorAll(".option");
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add("correct");
  });
  setTimeout(nextQuestion, 1200);
}

function selectAnswer(idx, btn) {
  if (locked) return;
  locked = true;
  clearInterval(timerId);
  const q = questions[current];
  const btns = document.querySelectorAll(".option");
  btns.forEach(b => b.disabled = true);
  if (idx === q.a) {
    btn.classList.add("correct");
    score++;
    document.getElementById("scoreNow").textContent = score;
  } else {
    btn.classList.add("wrong");
    btns[q.a].classList.add("correct");
  }
  setTimeout(nextQuestion, 1000);
}

function nextQuestion() {
  current++;
  if (current < questions.length) { showQuestion(); } else { finishQuiz(); }
}

function finishQuiz() {
  clearInterval(timerId);
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  const total = questions.length;
  const percent = Math.round(score / total * 100);
  document.getElementById("finalScore").textContent = `${score} / ${total}`;
  let msg = "";
  if (percent >= 90) msg = "🏆 Ájayıp! Siz Blockchain boyınsha ekspertsiz!";
  else if (percent >= 70) msg = "🎉 Jaqsı nátiyje! Biraz shınıǵıw menen 100% boladı.";
  else if (percent >= 50) msg = "👍 Orta nátiyje. Materialdı qayta kórip shıǵıń.";
  else msg = "📚 Basıw. Eske túsiriw kerek — qaytadan urınıp kóriń!";
  document.getElementById("finalMessage").textContent = `${percent}% — ${msg}`;
}
</script>
