<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain Quiz — 100 soraw</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

  /* Прогресс */
  .progress-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }
  .meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 24px; }

  /* Вопрос */
  .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; line-height: 1.5; }

  /* Ответы */
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .option {
    padding: 14px 18px; background: #334155; border: 2px solid transparent; border-radius: 12px;
    color: var(--text); font-size: 1rem; text-align: left; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .option:hover:not(:disabled) { background: #475569; border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option.correct { background: var(--correct); color: #052e16; font-weight: 600; }
  .option.wrong { background: var(--wrong); color: #450a0a; font-weight: 600; }

  /* Навигация */
  .nav { display: flex; justify-content: space-between; gap: 12px; }
  .btn-nav {
    padding: 10px 24px; background: #475569; color: var(--text); border: none; border-radius: 10px;
    font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .2s; font-family: inherit;
  }
  .btn-nav:hover:not(:disabled) { background: #64748b; }
  .btn-nav:disabled { opacity: .4; cursor: default; }
  .btn-nav.primary { background: var(--accent); color: white; }
  .btn-nav.primary:hover:not(:disabled) { background: #2563eb; }

  /* Экран результатов */
  .result { text-align: center; padding: 20px 0; }
  .result .score-big { font-size: 3.5rem; font-weight: 800; color: var(--accent); margin: 16px 0; }
  .result .message { font-size: 1.1rem; margin-bottom: 24px; color: var(--muted); }
  .btn { padding: 14px 32px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; font-family: inherit; }
  .btn:hover { background: #2563eb; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">

  <!-- Стартовый экран -->
  <div id="startScreen">
    <h1>⛓️ Blockchain Quiz</h1>
    <p class="subtitle">100 soraw · nátiyjení biliń</p>
    <button class="btn" onclick="startQuiz()">Baslaw 🚀</button>
  </div>

  <!-- Экран викторины -->
  <div id="quizScreen" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="meta">
      <span>Soraw <b id="qNum">1</b> / <b id="qTotal">100</b></span>
      <span>Ball: <b id="scoreNow">0</b></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="nav">
      <button class="btn-nav" id="backBtn" onclick="prevQuestion()">← Artqa</button>
      <button class="btn-nav primary" id="nextBtn" onclick="nextQuestion()">Alǵa →</button>
    </div>
  </div>

  <!-- Экран результатов -->
  <div id="resultScreen" class="hidden result">
    <h1>Nátiyje 🎉</h1>
    <div class="score-big" id="finalScore">0</div>
    <div class="message" id="finalMessage"></div>
    <button class="btn" onclick="location.reload()">Qaytadan 🔄</button>
  </div>
</div>

/* ============================================================
   ЛОГИКА ВИКТОРИНЫ
   ============================================================ */
let questions = [];
let current = 0;
let score = 0;
let locked = false;
let answers = [];

function startQuiz() {
  questions = QUESTIONS.map(q => ({ q: q.q, o: q.o, a: q.a }));
  current = 0;
  score = 0;
  answers = new Array(questions.length).fill(-1);
  document.getElementById("qTotal").textContent = questions.length;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[current];
  document.getElementById("qNum").textContent = current + 1;
  document.getElementById("scoreNow").textContent = score;
  document.getElementById("progressFill").style.width = ((current) / questions.length * 100) + "%";
  document.getElementById("questionText").textContent = q.q;

  const box = document.getElementById("optionsBox");
  box.innerHTML = "";
  const prevAnswer = answers[current];
  q.o.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    if (prevAnswer !== -1) {
      btn.disabled = true;
      if (idx === q.a) btn.classList.add("correct");
      if (idx === prevAnswer && prevAnswer !== q.a) btn.classList.add("wrong");
    } else {
      btn.onclick = () => selectAnswer(idx, btn);
    }
    box.appendChild(btn);
  });

  // Навигация
  document.getElementById("backBtn").disabled = (current === 0);
  const nextBtn = document.getElementById("nextBtn");
  // Вперёд можно, если на текущий вопрос уже дан ответ (или это не последний вопрос — но лучше требовать ответ)
  nextBtn.disabled = (prevAnswer === -1);
  // Меняем текст кнопки на последнем вопросе
  if (current === questions.length - 1) {
    nextBtn.textContent = "Juwmaqlaw 🏁";
  } else {
    nextBtn.textContent = "Alǵa →";
  }

  if (prevAnswer !== -1) {
    locked = true;
  }
}

function selectAnswer(idx, btn) {
  if (locked) return;
  locked = true;
  const q = questions[current];
  const btns = document.querySelectorAll(".option");
  btns.forEach(b => b.disabled = true);
  answers[current] = idx;
  if (idx === q.a) {
    btn.classList.add("correct");
    score++;
    document.getElementById("scoreNow").textContent = score;
  } else {
    btn.classList.add("wrong");
    btns[q.a].classList.add("correct");
  }
  // Активируем кнопку "Вперёд" после ответа
  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  // Нельзя идти вперёд без ответа
  if (answers[current] === -1) return;
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    showQuestion();
  }
}

function finishQuiz() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  const total = questions.length;
  const percent = Math.round(score / total * 100);
  document.getElementById("finalScore").textContent = `${score} / ${total}`;
  let msg = "";
  if (percent >= 90) msg = "🏆 Ájayıp! Siz Blockchain boyınsha ekspertsiz!";
  else if (percent >= 70) msg = "🎉 Jaqsı nátiyje! Biraz shınıǵıw menen 100% boladı.";
  else if (percent >= 50) msg = "👍 Orta nátiyje. Materialdı qayta kórip shıǵıń.";
  else msg = "📚 Basıw. Eske túsiriw kerek — qaytadan urınıp kóriń!";
  document.getElementById("finalMessage").textContent = `${percent}% — ${msg}`;
}
</script>
